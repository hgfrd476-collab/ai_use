<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="kgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1E3A8A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle (safe for maskable) -->
  <rect width="512" height="512" rx="128" fill="url(#kgGrad)" />

  <!-- Inner Decorative Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" />

  <!-- KampujaGo Icon Symbol: Stylized 'K' + Navigation Pin & Travel Motion Wing -->
  <g transform="translate(64, 64) scale(0.75)" filter="url(#glow)">
    <!-- Base House / Stay Arch -->
    <path d="M 256 90 L 380 200 L 380 390 C 380 406 366 420 350 420 L 162 420 C 146 420 132 406 132 390 L 132 200 Z" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Bold 'K' and Forward Arrow / Road -->
    <path d="M 190 160 L 190 350" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>
    <path d="M 190 256 L 310 160" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>
    <path d="M 235 220 L 325 350" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round"/>
    
    <!-- Motion Speed Arc (Transportation motif) -->
    <path d="M 100 320 C 140 370 210 400 280 390 C 350 380 400 330 420 270" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" stroke-dasharray="140 20"/>

    <!-- Map Pin Center Star / Sun -->
    <circle cx="256" cy="130" r="22" fill="url(#accentGrad)"/>
  </g>
</svg>
